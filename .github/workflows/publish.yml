name: Build and Publish

on:
  push:
    tags:
      - 'v*'  # 只在推送 v 开头的 tag 时触发
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MagicCenterHub

      - name: Build
        run: dotnet build src/MagicCenterHub --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/MagicCenterHub --configuration Release --no-restore --output ./publish

      - name: Remove PDB
        run: Remove-Item publish/*.pdb -Force

      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath MagicCenterHub.zip

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $currentTag = '${{ github.ref_name }}'
          $previousTag = @(git tag --sort=-version:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)

          if ($previousTag) {
            $commitLines = @(git log "$previousTag..$currentTag" --pretty=format:'- %s (`%h`)')
          }
          else {
            $commitLines = @(git log $currentTag --pretty=format:'- %s (`%h`)')
          }

          if ($commitLines.Count -eq 0) {
            $commitLines = @('- 无提交记录')
          }

          $notes = @('## 变更内容', '') + $commitLines
          $delimiter = "RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          @("body<<$delimiter"; ($notes -join "`n"); $delimiter) |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: MagicCenterHub.zip
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
